services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gradcafe
      POSTGRES_PASSWORD: gradcafe_password
      POSTGRES_DB: gradcafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradcafe -d gradcafe"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./src
      dockerfile: web/Dockerfile
    environment:
      DATABASE_URL: postgresql://gradcafe:gradcafe_password@db:5432/gradcafe
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./src
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://gradcafe:gradcafe_password@db:5432/gradcafe
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SEED_JSON: /data/applicant_data.json
    volumes:
      - ./src/data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata: